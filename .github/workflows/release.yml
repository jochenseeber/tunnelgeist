name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Every job only reads the repository; the job that publishes the GitHub
# release grants itself contents: write, and the docs job grants its workflow
# pages: write and id-token: write to deploy to GitHub Pages.
permissions:
  contents: read

# The release asset is the archive `rake dist:package` writes for the one
# release profile, tunnelgeist-darwin-arm64-system-static.tar.gz; the Homebrew
# formula (deploy/homebrew/tunnelgeist.rb) points at it.
#
# Repository secrets:
#   MACOS_CERTIFICATE_P12_BASE64    base64 of the Developer ID Application .p12
#   MACOS_CERTIFICATE_PASSWORD      the password of that .p12
#   MACOS_KEYCHAIN_PASSWORD         any password for the temporary keychain
#   MACOS_SIGN_IDENTITY             e.g. "Developer ID Application: Name (TEAMID)"
#   MACOS_NOTARY_API_KEY_P8_BASE64  base64 of the App Store Connect API key (.p8)
#   MACOS_NOTARY_KEY_ID             that key's Key ID
#   MACOS_NOTARY_ISSUER_ID          the App Store Connect Issuer ID
#   HOMEBREW_TAP_DEPLOY_KEY         SSH private key whose public key is a write
#                                   deploy key on jochenseeber/homebrew-tap
jobs:
  # The Crystal version (shard.yml's `actions.crystal`) and the project
  # version, which must match the tag: shard.yml is authoritative, so bump it
  # and tag to match, never the other way round.
  versions:
    name: Resolve versions and check the tag
    runs-on: ubuntu-latest
    outputs:
      crystal: ${{ steps.read.outputs.crystal }}
      project: ${{ steps.read.outputs.project }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: |
          set -euo pipefail
          crystal=$(ruby -r yaml -e 'puts YAML.load_file("shard.yml").dig("actions", "crystal")')
          test -n "$crystal"
          echo "crystal=$crystal" >> "$GITHUB_OUTPUT"

          project=$(ruby -r yaml -e 'puts YAML.load_file("shard.yml").fetch("version")')
          test -n "$project"
          echo "project=$project" >> "$GITHUB_OUTPUT"

          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$project" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match shard.yml version $project. Bump shard.yml and tag again." >&2
            exit 1
          fi

  # Nothing is built or published unless the whole CI suite passes for the
  # tagged commit.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  # `rake build:release` signs the program with the hardened runtime and its
  # entitlements and notarizes it, exactly as on a developer's machine; CI
  # only supplies what a developer's keychain would: the Developer ID
  # certificate and a notarytool keychain profile, both in a temporary
  # keychain. `rake dist:package` then packs the notarized program, and
  # `rake homebrew:formula:update` fills the formula from that archive.
  build:
    name: Build darwin-arm64-system-static
    runs-on: macos-15
    needs: [versions, ci]
    env:
      NOTARY_PROFILE: tunnelgeist-release
    steps:
      - uses: actions/checkout@v7

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ needs.versions.outputs.crystal }}

      # The static profile links Boehm GC statically from Homebrew's archive
      # (`static_libraries` in .project.yaml).
      - name: Install the static libraries
        run: brew install bdw-gc

      - name: Set up the signing keychain
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          NOTARY_API_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_API_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/build.keychain-db"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without the partition list codesign prompts for the keychain and
          # hangs.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          security default-keychain -s "$keychain"
          rm -f "$RUNNER_TEMP/cert.p12"

          # The keychain profile rake's notarization uses (NOTARY_PROFILE),
          # stored with the App Store Connect API key instead of an Apple ID.
          key="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"
          printf '%s' "$NOTARY_API_KEY_P8_BASE64" | base64 --decode > "$key"
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --keychain "$keychain"
          rm -f "$key"

      - name: Install dependencies
        run: shards install

      - name: Build, sign and notarize
        env:
          CODESIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: rake build:release

      - name: Package
        run: rake dist:package

      - name: Fill in the Homebrew formula
        run: rake homebrew:formula:update

      - uses: actions/upload-artifact@v7
        with:
          name: tunnelgeist-darwin-arm64-system-static
          path: dist/tunnelgeist-darwin-arm64-system-static.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: homebrew-formula
          path: deploy/homebrew/tunnelgeist.rb
          if-no-files-found: error

  release:
    name: Publish the GitHub release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tunnelgeist-darwin-arm64-system-static
          path: artifacts

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/tunnelgeist-*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true

  # Pages shows one version of the docs, so they follow the newest release; a
  # prerelease, whose tag has a suffix such as -rc.1, leaves the last
  # release's docs in place. The job grants the reusable workflow its
  # permissions, which cannot exceed the caller's.
  docs:
    name: Docs
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml

  # The filled formula goes to the tap only; the project keeps the template
  # with placeholder version and checksums.
  tap:
    name: Publish the formula to the tap
    runs-on: ubuntu-latest
    needs: [versions, release]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: homebrew-formula
          path: formula

      - name: Commit and push the formula
        env:
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          VERSION: ${{ needs.versions.outputs.project }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_deploy_key
          chmod 600 ~/.ssh/tap_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_deploy_key -o IdentitiesOnly=yes"
          git clone --depth 1 git@github.com:jochenseeber/homebrew-tap.git tap
          mkdir -p tap/Formula
          cp formula/tunnelgeist.rb tap/Formula/tunnelgeist.rb
          cd tap
          # Staged first: `git diff --quiet` ignores a file the tap does not
          # track yet, so a first formula would never be pushed.
          git add Formula/tunnelgeist.rb
          if git diff --cached --quiet -- Formula/tunnelgeist.rb; then
            echo "The tap already has tunnelgeist $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "tunnelgeist $VERSION" -- Formula/tunnelgeist.rb
          git push origin HEAD
